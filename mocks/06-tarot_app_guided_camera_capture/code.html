<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Aetheric Tarot - Camera Capture</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Lato:ital,wght@0,300;0,400;0,700;1,400&display=swap');
  </style>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mystic: {
              gold: '#d4af37',
              dark: '#0f0c1b',
              purple: '#5e4b8a',
              glow: '#a881e6',
              panel: '#1a1625',
            }
          },
          fontFamily: {
            serif: ['Cinzel', 'serif'],
            sans: ['Lato', 'sans-serif'],
          },
          backgroundImage: {
            'cosmic-gradient': 'linear-gradient(to bottom, #161124, #0f0c1b)',
          }
        }
      }
    }
  </script>
<style data-purpose="animations-and-glows">
    .glow-border {
      box-shadow: 0 0 15px rgba(168, 129, 230, 0.4), inset 0 0 10px rgba(168, 129, 230, 0.2);
      border-color: rgba(168, 129, 230, 0.8);
    }
    
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.8; box-shadow: 0 0 15px rgba(168, 129, 230, 0.4); }
      50% { opacity: 1; box-shadow: 0 0 25px rgba(168, 129, 230, 0.7); }
    }
    
    .card-guide {
      animation: pulse-glow 3s infinite ease-in-out;
      backdrop-filter: blur(2px);
    }

    .pulse-dot {
      animation: pulse-glow 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-black text-white h-screen w-full overflow-hidden font-sans antialiased flex items-center justify-center">
<!-- BEGIN: Mobile App Container -->
<main class="relative w-full h-full max-w-[400px] max-h-[864px] bg-mystic-dark flex flex-col sm:border sm:border-mystic-purple/30 sm:rounded-3xl overflow-hidden shadow-2xl" data-purpose="app-container">
<!-- Background Image (Simulating Camera View) -->
<div class="absolute inset-0 z-0" data-purpose="camera-view">
<img alt="Camera View Background" class="w-full h-full object-cover opacity-80" src="https://lh3.googleusercontent.com/aida/ADBb0uj5BYVwbd7yvc_I0Io7_j6443nDDxfBnXrtqWsD6IVsAsMslf3iSjQl472J6GFvqgARwOa-Oo3hoBoMduJp4PLrZ4v0caC-9wFjk6SBNRulwit9d8jhigjYyKvp22Ma4WGHOVIaDPWOyLah8q9KuYze4z3I-ZywZsr7nNsNIhRzQcH9F0Evngjl7TCupdOJKyXHZTygQsHvYHPWAn8Y-8CBinCHuRV85mRIbitcSbH70SLYYMWwSj26k-txoY4IHNXf4QC_yUgqog"/>
<div class="absolute inset-0 bg-black/30 pointer-events-none"></div>
</div>
<!-- BEGIN: Top Bar -->
<header class="relative z-10 flex items-center justify-between px-6 pt-12 pb-4" data-purpose="top-navigation">
<!-- Close Button -->
<button aria-label="Close" class="w-10 h-10 rounded-full bg-mystic-panel/80 backdrop-blur-md border border-mystic-purple/30 flex items-center justify-center text-mystic-gold hover:bg-mystic-panel transition-colors shadow-lg">
<svg class="h-5 w-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Center Logo (Sun) -->
<div class="flex items-center justify-center text-mystic-gold" data-purpose="app-logo">
<svg fill="none" height="32" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" r="4"></circle>
<path d="M12 2v2"></path>
<path d="M12 20v2"></path>
<path d="m4.93 4.93 1.41 1.41"></path>
<path d="m17.66 17.66 1.41 1.41"></path>
<path d="M2 12h2"></path>
<path d="M20 12h2"></path>
<path d="m6.34 17.66-1.41 1.41"></path>
<path d="m19.07 4.93-1.41 1.41"></path>
</svg>
</div>
<!-- Right Actions (Flash & Help) -->
<div class="flex gap-3" data-purpose="right-actions">
<!-- Flash Button -->
<button aria-label="Toggle Flash" class="w-10 h-10 rounded-full bg-mystic-panel/80 backdrop-blur-md border border-mystic-purple/30 flex items-center justify-center text-mystic-gold hover:bg-mystic-panel transition-colors shadow-lg">
<svg fill="currentColor" height="20" stroke="none" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
</svg>
</button>
<!-- Help Button -->
<button aria-label="Help" class="w-10 h-10 rounded-full bg-mystic-panel/80 backdrop-blur-md border border-mystic-purple/30 flex items-center justify-center text-mystic-gold hover:bg-mystic-panel transition-colors shadow-lg">
<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" r="10"></circle>
<path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
<line x1="12" x2="12.01" y1="17" y2="17"></line>
</svg>
</button>
</div>
</header>
<!-- END: Top Bar -->
<!-- BEGIN: Guidance Toast -->
<div class="relative z-20 flex justify-center mt-2 px-4 pointer-events-none" data-purpose="status-toast">
<div class="bg-mystic-panel/90 backdrop-blur-md border border-mystic-purple/40 rounded-3xl py-3 px-5 flex items-center gap-4 shadow-xl pointer-events-auto">
<!-- Animated Dot -->
<div class="w-3.5 h-3.5 rounded-full bg-mystic-glow pulse-dot shadow-[0_0_8px_rgba(168,129,230,0.8)]"></div>
<div class="flex flex-col">
<span class="text-sm font-medium text-white tracking-wide">Enfocá 1 a 3 cartas</span>
<span class="text-xs text-gray-400">Detectando bordes...</span>
</div>
</div>
</div>
<!-- END: Guidance Toast -->
<!-- BEGIN: Smart Overlays (Simulated Card Guides) -->
<div class="relative flex-1 z-10 flex items-center justify-center gap-4 px-8 mt-12 pointer-events-none" data-purpose="camera-guides">
<!-- Card Guide 1 -->
<div class="w-1/3 aspect-[1/2] rounded-xl border-2 card-guide glow-border flex items-center justify-center transform -rotate-3 transition-all duration-500">
<!-- Optional: Center crosshair or icon for guide -->
<svg class="h-8 w-8 text-mystic-gold/50" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="1"></path>
</svg>
</div>
<!-- Card Guide 2 -->
<div class="w-1/3 aspect-[1/2] rounded-xl border-2 card-guide glow-border flex items-center justify-center transform scale-105 transition-all duration-500 delay-100">
<svg class="h-8 w-8 text-mystic-gold/50" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="1"></path>
</svg>
</div>
<!-- Card Guide 3 -->
<div class="w-1/3 aspect-[1/2] rounded-xl border-2 card-guide glow-border flex items-center justify-center transform rotate-3 transition-all duration-500 delay-200">
<svg class="h-8 w-8 text-mystic-gold/50" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="1"></path>
</svg>
</div>
</div>
<!-- END: Smart Overlays -->
<!-- BEGIN: Bottom Controls -->
<footer class="relative z-20 pb-12 pt-6 px-6 flex flex-col items-center gap-8 bg-gradient-to-t from-black/80 to-transparent" data-purpose="bottom-controls">
<!-- Zoom Selector -->
<div class="bg-mystic-panel/80 backdrop-blur-md rounded-full px-1 py-1 flex items-center gap-1 border border-mystic-purple/30 shadow-lg">
<button class="px-4 py-1.5 rounded-full text-sm font-medium text-gray-300 hover:text-white transition-colors">0.7x</button>
<button class="px-4 py-1.5 rounded-full text-sm font-bold text-mystic-gold bg-white/5 transition-colors">1x</button>
<button class="px-4 py-1.5 rounded-full text-sm font-medium text-gray-300 hover:text-white transition-colors">2x</button>
</div>
<!-- Main Action Row -->
<div class="w-full flex items-center justify-between relative h-20">
<!-- Left spacer to center the shutter button -->
<div class="flex-1"></div>
<!-- Shutter Button -->
<button aria-label="Capture Photo" class="absolute left-1/2 transform -translate-x-1/2 w-20 h-20 rounded-full border-4 border-white/80 p-1 flex items-center justify-center hover:scale-105 active:scale-95 transition-transform shadow-[0_0_20px_rgba(255,255,255,0.2)]">
<div class="w-full h-full bg-white rounded-full"></div>
</button>
<!-- Right Action (Upload) -->
<div class="flex-1 flex justify-end">
<button class="bg-mystic-panel/80 backdrop-blur-md border border-mystic-purple/40 rounded-xl px-4 py-3 flex items-center gap-2 text-sm font-medium text-gray-200 hover:bg-mystic-panel transition-colors shadow-lg">
<svg class="text-mystic-gold" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
<polyline points="17 8 12 3 7 8"></polyline>
<line x1="12" x2="12" y1="3" y2="15"></line>
</svg>
            Subir foto
          </button>
</div>
</div>
</footer>
<!-- END: Bottom Controls -->
</main>
<!-- END: Mobile App Container -->
</body></html>
