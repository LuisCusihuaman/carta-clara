<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Búsqueda Activa - Tarot App</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@400;500&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0c10;
      color: #e0e0e0;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    /* Simulate Mobile Device Frame */
    .mobile-container {
      width: 390px;
      height: 844px;
      background-color: #0d0a1b; /* Deep navy/purple theme */
      position: relative;
      overflow: hidden;
      border-radius: 40px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      border: 8px solid #222;
      display: flex;
      flex-direction: column;
    }

    /* Custom Scrollbar for Filters */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mystic: {
              bg: '#0d0a1b',
              card: '#1a162a',
              input: '#151124',
              gold: '#d4af37',
              goldLight: '#eacc7a',
              text: '#e0e0e0',
              textMuted: '#9ca3af',
              border: '#2d2446',
              kbBg: '#212121',
              kbKey: '#424242',
              kbKeyDark: '#303030',
              kbBlue: '#007aff'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0b0c10]">
<!-- BEGIN: MobileContainer -->
<div class="w-full min-h-screen bg-mystic-bg flex flex-col max-w-lg mx-auto" data-purpose="app-frame">
<!-- BEGIN: StatusBar -->
<!-- END: StatusBar -->
<!-- BEGIN: MainContent -->
<main class="flex-1 overflow-y-auto px-4 pb-8" data-purpose="scrollable-content">
<!-- BEGIN: TopBar -->
<header class="flex justify-between items-center py-4" data-purpose="app-header">
<div class="w-8"></div> <!-- Spacer for center alignment -->
<div class="text-mystic-gold flex flex-col items-center justify-center">
<!-- Sun Icon SVG Placeholder -->
<svg class="w-10 h-10" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</svg>
</div>
<button class="w-10 h-10 rounded-full border border-mystic-border flex items-center justify-center text-mystic-gold bg-mystic-card bg-opacity-50">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
</header>
<!-- END: TopBar -->
<!-- BEGIN: SearchInput -->
<section class="mt-2" data-purpose="search-box">
<div class="relative flex items-center w-full h-12 rounded-2xl bg-mystic-input border border-mystic-border px-4 shadow-sm focus-within:border-mystic-gold focus-within:ring-1 focus-within:ring-mystic-gold transition-colors" style="border-color: #d4af37;">
<svg class="w-5 h-5 text-mystic-textMuted mr-3" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<input autofocus="" class="flex-1 bg-transparent border-none text-white focus:ring-0 placeholder-mystic-textMuted text-lg p-0" placeholder="Buscar..." type="text" value="luna"/>
<button class="ml-2 text-mystic-textMuted hover:text-white p-1 rounded-full bg-mystic-card">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
<div class="ml-3 pl-3 border-l border-mystic-border flex items-center justify-center text-mystic-gold">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
</div>
</section>
<!-- END: SearchInput -->
<!-- BEGIN: FilterChips -->
<section class="mt-4" data-purpose="search-filters">
<div class="flex overflow-x-auto hide-scrollbar space-x-2 pb-2">
<button class="px-4 py-1.5 rounded-full border border-mystic-gold text-mystic-goldLight text-sm font-medium whitespace-nowrap bg-mystic-gold bg-opacity-10" style="background-color: rgba(212, 175, 55, 0.2); border-color: #d4af37; color: #eacc7a;">Todos</button>
<button class="px-4 py-1.5 rounded-full border border-mystic-border text-mystic-textMuted text-sm font-medium whitespace-nowrap bg-mystic-input hover:bg-mystic-card">Mayores</button>
<button class="px-4 py-1.5 rounded-full border border-mystic-border text-mystic-textMuted text-sm font-medium whitespace-nowrap bg-mystic-input hover:bg-mystic-card">Copas</button>
<button class="px-4 py-1.5 rounded-full border border-mystic-border text-mystic-textMuted text-sm font-medium whitespace-nowrap bg-mystic-input hover:bg-mystic-card">Espadas</button>
<button class="px-4 py-1.5 rounded-full border border-mystic-border text-mystic-textMuted text-sm font-medium whitespace-nowrap bg-mystic-input hover:bg-mystic-card">Bastos</button>
</div>
</section>
<!-- END: FilterChips -->
<!-- BEGIN: BestResult -->
<section class="mt-6" data-purpose="best-result">
<h2 class="text-mystic-text font-semibold text-base mb-3">Mejor resultado</h2>
<div class="bg-mystic-card rounded-2xl p-3 flex items-center border border-mystic-border shadow-lg relative overflow-hidden">
<!-- Inner Glow Effect -->
<div class="absolute inset-0 bg-gradient-to-br from-mystic-card via-transparent to-mystic-card opacity-50 pointer-events-none"></div>
<div class="w-20 h-28 rounded-lg overflow-hidden shrink-0 border border-mystic-gold border-opacity-30 relative z-10">
<img alt="La Luna Tarot Card" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuACX9UBehwzT_C1ARUVrEjakJPTJpF0X0kfPGvUMKGu0d-i2Ft_BO164KlgItbiDHmMoqUKUfT-DPe2x2KxB1NeNFge--72fcu0UpMKNow8iT7mSia8cw7XUFSR7WH8CxvQMuuquzqWEbH4ipc6z97Ln5htBgZ1g00tIhtxTf_YtMiYvZWqnJBS8JRceuhb-y-YqO7EltvRxAsYvoeVcfdyzDO0FrNpsUKIlNRGAw_TPlBihnBBQF3pOoz3YNDV2Gn_DTTzLRiYFD0"/>
</div>
<div class="ml-4 flex-1 z-10">
<h3 class="font-cinzel text-xl text-mystic-text font-semibold mb-1">La Luna</h3>
<p class="text-mystic-textMuted text-xs mb-2">XVIII · Arcano Mayor</p>
<p class="text-mystic-text text-sm leading-snug pr-4">Confusión · intuición · cosas ocultas</p>
</div>
<div class="text-mystic-textMuted pr-2 z-10">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
</div>
</section>
<!-- END: BestResult -->
<!-- BEGIN: Suggestions -->
<section class="mt-8" data-purpose="search-suggestions">
<h2 class="text-mystic-text font-semibold text-base mb-4">Sugerencias</h2>
<ul class="space-y-4">
<li class="flex items-center justify-between text-mystic-text group cursor-pointer">
<div class="flex items-center">
<svg class="w-5 h-5 text-mystic-textMuted mr-3" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span class="text-[15px]"><span class="font-semibold text-white">luna</span> significado</span>
</div>
<svg class="w-4 h-4 text-mystic-textMuted" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</li>
<li class="flex items-center justify-between text-mystic-text group cursor-pointer">
<div class="flex items-center">
<svg class="w-5 h-5 text-mystic-textMuted mr-3" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span class="text-[15px]"><span class="font-semibold text-white">luna</span> invertida</span>
</div>
<svg class="w-4 h-4 text-mystic-textMuted" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</li>
<li class="flex items-center justify-between text-mystic-text group cursor-pointer">
<div class="flex items-center">
<svg class="w-5 h-5 text-mystic-textMuted mr-3" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span class="text-[15px]">la <span class="font-semibold text-white">luna</span> tarot</span>
</div>
<svg class="w-4 h-4 text-mystic-textMuted" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</li>
<li class="flex items-center justify-between text-mystic-text group cursor-pointer">
<div class="flex items-center">
<svg class="w-5 h-5 text-mystic-textMuted mr-3" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span class="text-[15px]"><span class="font-semibold text-white">luna</span> arcano mayor</span>
</div>
<svg class="w-4 h-4 text-mystic-textMuted" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</li>
</ul>
</section>
<!-- END: Suggestions -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: Keyboard -->
<!-- END: Keyboard -->
</div>
<!-- END: MobileContainer -->
</body></html>
